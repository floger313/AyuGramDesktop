name: Build Windows Telegram Fork

on:
  workflow_dispatch:
  push:
    branches: [ dev, main ]

jobs:
  build-windows:
    name: Build Windows x64
    runs-on: windows-2022

    defaults:
      run:
        shell: cmd

    steps:
      - name: Prepare directories
        run: |
          mkdir %userprofile%\TBuild\Libraries
          mklink /d %GITHUB_WORKSPACE%\TBuild %userprofile%\TBuild
          echo TBUILD=%GITHUB_WORKSPACE%\TBuild>>%GITHUB_ENV%
          echo LibrariesPath=%GITHUB_WORKSPACE%\TBuild\Libraries\win64>>%GITHUB_ENV%

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build tools
        run: |
          choco install ninja nasm -y

      - name: Build Telegram Desktop
        run: |
          echo Building Telegram Desktop...
          cd Telegram
          call configure.bat x64 -D TDESKTOP_API_TEST=ON
          cmake --build ..\out --config Release --parallel

      - name: Upload Telegram Binary
        uses: actions/upload-artifact@v4
        with:
          name: Telegram-Windows-x64
          path: |
            out/Release/Telegram.exe
            out/Release/Updater.exe
          if-no-files-found: warn
