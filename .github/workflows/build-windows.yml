name: Build Windows Telegram Fork

on:
  workflow_dispatch:
  push:
    branches: [ dev, main ]

jobs:
  build-windows:
    name: Build Windows x64
    runs-on: windows-2022
    timeout-minutes: 360

    defaults:
      run:
        shell: cmd

    steps:
      - name: Configure Pagefile on Runner
        uses: al-cheb/configure-pagefile-action@v1.5
        with:
          minimum-size: 32GB
          maximum-size: 32GB
          disk-root: "C:"

      - name: Prepare directories
        run: |
          mkdir %userprofile%\TBuild\Libraries
          mkdir %userprofile%\TBuild\ThirdParty
          mklink /d %GITHUB_WORKSPACE%\TBuild %userprofile%\TBuild
          echo TBUILD=%GITHUB_WORKSPACE%\TBuild>>%GITHUB_ENV%
          echo LibrariesPath=%GITHUB_WORKSPACE%\TBuild\Libraries\win64>>%GITHUB_ENV%

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          path: TBuild/tdesktop
          submodules: recursive
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up MSVC Dev Environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install build tools
        run: |
          choco install ninja nasm -y

      - name: Restore ThirdParty and Libraries Cache
        id: cache-tbuild
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ env.TBUILD }}/Libraries
            ${{ env.TBUILD }}/ThirdParty
          key: ${{ runner.os }}-tbuild-${{ hashFiles('TBuild/tdesktop/Telegram/build/prepare/**') }}
          restore-keys: |
            ${{ runner.os }}-tbuild-

      - name: Prepare Libraries
        run: |
          cd %TBUILD%\tdesktop
          call Telegram\build\prepare\win.bat

      - name: Save ThirdParty and Libraries Cache
        if: steps.cache-tbuild.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ env.TBUILD }}/Libraries
            ${{ env.TBUILD }}/ThirdParty
          key: ${{ steps.cache-tbuild.outputs.cache-primary-key || format('{0}-tbuild-{1}', runner.os, hashFiles('TBuild/tdesktop/Telegram/build/prepare/**')) }}

      - name: Configure CMake
        run: |
          cd %TBUILD%\tdesktop\Telegram
          call configure.bat x64 -D TDESKTOP_API_ID=2040 -D TDESKTOP_API_HASH=b18441a1ff607e10a989891a5462e627 -D TDESKTOP_API_TEST=ON

      - name: Build Telegram Desktop
        run: |
          cmake --build %TBUILD%\tdesktop\out --config Release --parallel 2 -- /p:PreferredToolArchitecture=x64

      - name: Upload Telegram Binary
        uses: actions/upload-artifact@v4
        with:
          name: Telegram-Windows-x64
          path: |
            ${{ env.TBUILD }}/tdesktop/out/Release/*.exe
          if-no-files-found: error
